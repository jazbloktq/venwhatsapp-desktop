name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching the Cargo version (for example v0.1.0); leave empty to build only"
        required: false
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [ -n "$tag" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
            [ "$tag" = "v$version" ] || { echo "::error::tag $tag does not match v$version"; exit 1; }
            if [ "$GITHUB_REF_TYPE" != tag ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag already exists"; exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Load release notes
        id: notes
        shell: bash
        run: |
          file="docs/release-notes/${RELEASE_TAG}.md"
          {
            echo "body<<VENWHATSAPP_NOTES_EOF"
            if [ -n "$RELEASE_TAG" ] && [ -f "$file" ]; then cat "$file"; fi
            echo "VENWHATSAPP_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG != '' && format('Venwhatsapp {0}', env.RELEASE_TAG) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: ${{ env.RELEASE_TAG != '' }}
          prerelease: false

  publish:
    if: needs.prepare.outputs.tag != ''
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Check installer assets, checksum them, and publish
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" | head -n1)
          [ -n "$release_id" ] || { echo "::error::no draft release found for $RELEASE_TAG"; exit 1; }
          mkdir -p release-assets
          gh api --paginate "repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
            --jq '.[] | "\(.id) \(.size) \(.name)"' > assets.txt
          while read -r id size name; do
            case "$name" in
              SHA256SUMS) continue ;;
              */* | *\ * | .*) echo "::error::unexpected asset name: $name"; exit 1 ;;
            esac
            gh api -H "Accept: application/octet-stream" \
              "repos/$GH_REPO/releases/assets/$id" > "release-assets/$name"
            actual_size=$(stat -c %s "release-assets/$name")
            [ "$actual_size" = "$size" ] || { echo "::error::$name download size mismatch"; exit 1; }
          done < assets.txt
          compgen -G 'release-assets/Venwhatsapp_*_x64-setup.exe' >/dev/null \
            || { echo "::error::NSIS installer is missing"; exit 1; }
          compgen -G 'release-assets/Venwhatsapp_*_x64_en-US.msi' >/dev/null \
            || { echo "::error::MSI installer is missing"; exit 1; }
          rm -f release-assets/SHA256SUMS
          (cd release-assets && sha256sum -- * > SHA256SUMS)
          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
